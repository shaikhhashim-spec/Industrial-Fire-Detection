<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <meta name="color-scheme" content="dark" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0e13; color: #e4eaf0; font: 15px/1.5 system-ui, -apple-system, sans-serif; }
      div { max-width: 26rem; padding: 1.5rem; text-align: center; }
      p { margin: 0 0 1.25rem; color: #a1adba; }
      a { display: inline-block; padding: 0.55rem 1rem; border-radius: 6px; background: #5cb8dc; color: #061018; font-weight: 500; text-decoration: none; }
    </style>
  </head>
  <body>
    <div>
      <h1 style="font-size:1.25rem;margin:0 0 .4rem">Page not found</h1>
      <p>That page does not exist.</p>
      <a id="home-link" href="/">Go to the Overview</a>
    </div>
    <script>
      // This file has no build step and is served as-is at whatever path 404'd,
      // so it cannot know the repo name at build time the way every other page
      // does (BASE_PATH). Take it from the URL that got here instead, so this
      // keeps working if the repo is ever renamed.
      var seg = location.pathname.split("/")[1];
      if (seg) document.getElementById("home-link").href = "/" + seg + "/";
    </script>
  </body>
</html>
