<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings — Thermal Intelligence</title>
    <meta name="description" content="Personal workspace preferences, published observation dates and snapshot downloads." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thermal Intelligence" />
    <meta property="og:title" content="Settings — Thermal Intelligence" />
    <meta property="og:description" content="Personal workspace preferences, published observation dates and snapshot downloads." />
    <meta property="og:url" content="https://shaikhhashim-spec.github.io/Industrial-Fire-Detection/settings.html" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="globe/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <div class="brand">Thermal Intelligence</div>
        <div class="brand-sub">Satellite thermal monitoring for India</div>
        <nav class="nav" id="nav" aria-label="Sections"></nav>
<p class="side-note">NASA FIRMS observations. Human verification required. Personal reviews stay in this browser.</p>
      </aside>

      <main class="main">
        <header class="topbar plain">
          <div class="topbar-brand">
            <h1>
              <span class="page-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h4M12 12h8M4 18h11M19 18h1" /><circle cx="15" cy="6" r="2" /><circle cx="8" cy="12" r="2" /><circle cx="17" cy="18" r="2" /></svg>
              </span>
              Settings
            </h1>
            <p class="sub">Personal preferences and published observations.</p>
          </div>
          <label class="field">
            <span class="field-label">Region</span>
            <span class="select" aria-label="Region">India</span>
          </label>
          <div class="topbar-meta" id="meta">Live NASA FIRMS<br />Loading</div>
        </header>
        <hr class="topbar-rule" />

<div id="content" aria-live="polite">
          <p class="loading">Loading published observations</p>
          <noscript><p class="loading">JavaScript is required to load the workspace.</p></noscript>
        </div>
      </main>
    </div>
    <script type="module" src="settings.js"></script>
  </body>
</html>
