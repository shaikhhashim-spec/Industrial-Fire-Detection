name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Rebuild on a schedule so the published globe picks up fresh NASA FIRMS data.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Add this under Settings > Secrets and variables > Actions. Without it the
      # refresh step is skipped and the site ships the events.json committed in the repo.
      FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Decide whether data needs refreshing
        id: refresh_policy
        run: python3 scripts/pages_refresh_policy.py >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Restore bounded global feed and reference cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache/firms_global_*.csv
            data/cache/wind_*.json
            data/cache/weather_*.json
            data/reference/global_power_plant_database.csv
            data/reference/cities15000.txt
            holo-view-maker/public/data/global-events.json
            holo-view-maker/public/data/global-events.json.gz
            holo-view-maker/public/data/global-facilities.geojson
          key: global-feeds-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: global-feeds-v1-${{ runner.os }}-

      - name: Refresh public global FIRMS data
        id: global_refresh
        if: steps.refresh_policy.outputs.global_needed == 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/refresh_global_globe.py --max-events 12000 --weather-limit 40 --refresh-references

      - name: Flag a failed global refresh
        if: steps.global_refresh.outcome == 'failure'
        run: |
          echo "::warning::Global FIRMS refresh failed; previous global snapshot retained if available."
          echo "Global FIRMS refresh failed; prior snapshot retained if available. India data is independent." >> "$GITHUB_STEP_SUMMARY"

      # Live data only: if FIRMS is unreachable or the run fails, keep the last
      # committed live snapshot rather than publishing nothing. continue-on-error
      # is deliberate — a flag on this step so the deploy still visibly says so,
      # rather than a green run silently shipping stale data with no signal.
      - name: Refresh live FIRMS data
        id: refresh
        if: env.FIRMS_API_KEY != '' && steps.refresh_policy.outputs.national_needed == 'true'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          python scripts/refresh_national_globe.py

      - name: Flag a stale refresh
        if: env.FIRMS_API_KEY != '' && steps.refresh.outcome == 'failure'
        run: |
          echo "::warning::Live FIRMS refresh failed — deploying with the last committed snapshot instead of fresh data."
          echo "### :warning: Live FIRMS refresh failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploying with the last committed \`events.json\` snapshot instead of a fresh pull." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: holo-view-maker/package-lock.json

      - name: Install dependencies
        working-directory: holo-view-maker
        run: npm ci

      - name: Build the 3D globe
        working-directory: holo-view-maker
        env:
          # The globe lives under /globe/ inside the project site, which is served
          # from /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/globe/
        run: npm run build

      # The Overview page at the root, the globe under /globe/: the same shape the
      # local gateway serves.
      - name: Assemble the site
        run: python3 scripts/assemble_pages_site.py --out _site

      - name: Precompute thermal evidence on published snapshot copies
        run: python3 scripts/precompute_thermal_site.py --site _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    # Only the actual publish step needs to serialize (an in-flight deploy
    # cancelled mid-upload can leave Pages half-updated) — the build job above
    # is unconstrained, so an urgent push-triggered build no longer has to
    # queue for up to 40 minutes behind a slow scheduled refresh's build.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
