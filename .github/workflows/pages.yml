name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Rebuild on a schedule so the published globe picks up fresh NASA FIRMS data.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Add this under Settings > Secrets and variables > Actions. Without it the
      # refresh step is skipped and the site ships the events.json committed in the repo.
      FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        if: env.FIRMS_API_KEY != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # Live data only: if FIRMS is unreachable or the run fails, keep the last
      # committed live snapshot rather than publishing nothing.
      - name: Refresh live FIRMS data
        if: env.FIRMS_API_KEY != ''
        continue-on-error: true
        timeout-minutes: 25
        run: |
          pip install -r requirements.txt
          python scripts/refresh_national_globe.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: holo-view-maker/package-lock.json

      - name: Install dependencies
        working-directory: holo-view-maker
        run: npm ci

      - name: Build
        working-directory: holo-view-maker
        run: npm run build

      - name: Prepare SPA for GitHub Pages
        working-directory: holo-view-maker/.output/public
        run: |
          touch .nojekyll
          cp index.html 404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: holo-view-maker/.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
