name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.16.5

      - name: Lint
        run: ruff check .

      # FIRMS calls are mocked, so no API key or network access is needed.
      - name: Test
        run: pytest -q

  globe:
    name: 3D globe type-check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: holo-view-maker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: holo-view-maker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Guards the GitHub Pages bug where root-relative URLs (/data/..., /vendor/...)
      # 404 under /<repo>/ and the map drew no hotspots.
      - name: Check the build has no root-relative asset URLs
        run: |
          if grep -rEl "[\"'\`]/(data|vendor)/" .output/public/assets; then
            echo "::error::Root-relative /data or /vendor URL found; use assetUrl() from src/lib/asset-url.ts"
            exit 1
          fi
